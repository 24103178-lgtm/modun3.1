<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gallery - 时代少年团</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <a href="#main" class="skip-link">
        Chuyển đến nội dung chính
    </a>

    <main id="main">

        <h1>时代少年团</h1>

        <!-- Khung hiển thị ảnh -->
        <div id="image">
            Hover over an image below to display here.
        </div>

        <!-- Gallery -->
        <div class="gallery">

            <div class="member">
                <img src="./images/tnt1.jpg"
                     alt="1"
                     onmouseover="upDate(this)"
                     onmouseout="undo()">
                <p>1</p>
            </div>

            <div class="member">
                <img src="./images/tnt2.jpg"
                     alt="2"
                     onmouseover="upDate(this)"
                     onmouseout="undo()">
                <p>2</p>
            </div>

            <div class="member">
                <img src="./images/tnt3.jpg"
                     alt="3"
                     onmouseover="upDate(this)"
                     onmouseout="undo()">
                <p>3</p>
            </div>

            <div class="member">
                <img src="./images/tnt4.jpg"
                     alt="3"
                     onmouseover="upDate(this)"
                     onmouseout="undo()">
                <p>4</p>
            </div>

            <div class="member">
                <img src="./images/tnt5.jpg"
                     alt="3"
                     onmouseover="upDate(this)"
                     onmouseout="undo()">
                <p>5</p>
            </div>

            <div class="member">
                <img src="./images/tnt6.jpg"
                     alt="3"
                     onmouseover="upDate(this)"
                     onmouseout="undo()">
                <p>6</p>
            </div>

    </main>

    <script src="./JavaScript/script.cs"></script>

</body>
</html>
